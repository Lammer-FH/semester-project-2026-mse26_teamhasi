services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: hotel
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - hotel_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "admin", "-root"]
      timeout: 20s
      retries: 10
      interval: 10s

volumes:
  hotel_db_data: