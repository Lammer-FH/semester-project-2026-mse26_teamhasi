openapi: 3.0.3
info:
  title: Hotel Booking API
  version: 1.0.1
  description: REST API for managing rooms, room types, users, orders, media, room extras, and their relationships.

servers:
  - url: /api/v1

tags:
  - name: Room Types
  - name: Rooms
  - name: Users
  - name: Orders
  - name: Media
  - name: Room Extras

paths:
  /room-types:
    get:
      tags: [Room Types]
      summary: Retrieve all room types
      responses:
        "200":
          description: Room type list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomType"
    post:
      tags: [Room Types]
      summary: Create a new room type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomTypeCreate"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"

  /room-types/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [Room Types]
      summary: Retrieve a specific room type
      responses:
        "200":
          description: Room type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomType"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Room Types]
      summary: Update a specific room type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomTypeUpdate"
      responses:
        "200":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Room Types]
      summary: Delete a specific room type
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /room-types/{id}/media:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [Room Types, Media]
      summary: Retrieve media associated with a room type
      responses:
        "200":
          description: Media list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Media"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Room Types, Media]
      summary: Link a media item to a room type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomTypeMediaCreate"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /rooms:
    get:
      tags: [Rooms]
      summary: Retrieve all rooms
      responses:
        "200":
          description: Room list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
    post:
      tags: [Rooms]
      summary: Create a new room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreate"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"

  /rooms/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [Rooms]
      summary: Retrieve a specific room
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Rooms]
      summary: Update a specific room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUpdate"
      responses:
        "200":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Rooms]
      summary: Delete a specific room
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /rooms/{id}/extras:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [Rooms, Room Extras]
      summary: Retrieve extras associated with a room
      responses:
        "200":
          description: Room extras list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomExtra"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Rooms, Room Extras]
      summary: Link a room extra to a room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomExtraAssignmentCreate"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /users:
    get:
      tags: [Users]
      summary: Retrieve all users
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      tags: [Users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [Users]
      summary: Retrieve a specific user
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Users]
      summary: Update a specific user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders:
    get:
      tags: [Orders]
      summary: Retrieve all orders
      parameters:
        - in: query
          name: userId
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: roomId
          schema:
            type: integer
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      tags: [Orders]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /orders/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [Orders]
      summary: Retrieve a specific order
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Orders]
      summary: Update a specific order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Orders]
      summary: Delete a specific order
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /media:
    get:
      tags: [Media]
      summary: Retrieve all media files
      responses:
        "200":
          description: Media list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Media"
    post:
      tags: [Media]
      summary: Create a new media item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaCreate"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"

  /media/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [Media]
      summary: Retrieve a specific media item
      responses:
        "200":
          description: Media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Media]
      summary: Delete a specific media item
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /room-extras:
    get:
      tags: [Room Extras]
      summary: Retrieve all room extras
      responses:
        "200":
          description: Room extras list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomExtra"
    post:
      tags: [Room Extras]
      summary: Create a new room extra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomExtraCreate"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"

  /room-extras/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [Room Extras]
      summary: Retrieve a specific room extra
      responses:
        "200":
          description: Room extra
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomExtra"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Room Extras]
      summary: Update a specific room extra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomExtraUpdate"
      responses:
        "200":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Room Extras]
      summary: Delete a specific room extra
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32

  responses:
    BadRequest:
      description: Bad Request
    NotFound:
      description: Not Found
    UnprocessableEntity:
      description: Unprocessable Entity

  schemas:
    RoomType:
      type: object
      properties:
        roomTypeId:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
          nullable: true
        capacity:
          type: integer
          format: int32
        pricePerNight:
          type: number
          format: float
        media:
          type: array
          items:
            $ref: '#/components/schemas/Media'
      required: [roomTypeId, name, capacity, pricePerNight]

    RoomTypeCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        capacity:
          type: integer
          format: int32
        pricePerNight:
          type: number
          format: float
      required: [name, capacity, pricePerNight]

    RoomTypeUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        capacity:
          type: integer
          format: int32
        pricePerNight:
          type: number
          format: float

    Room:
      type: object
      properties:
        roomId:
          type: integer
          format: int32
        floor:
          type: integer
          format: int32
          nullable: true
        roomNumber:
          type: string
        roomExtras: 
          type: array
          items: 
            $ref: '#/components/schemas/RoomExtra'
        roomType: 
          $ref: '#/components/schemas/RoomType'

      required: [roomId, roomTypeId, roomNumber]

    RoomCreate:
      type: object
      properties:
        roomNumber:
          type: string
        floor:
          type: integer
          format: int32
          nullable: true
        roomTypeId:
          type: integer
          format: int32
      required: [roomNumber, roomTypeId]

    RoomUpdate:
      type: object
      properties:
        roomNumber:
          type: string
        floor:
          type: integer
          format: int32
          nullable: true
        roomTypeId:
          type: integer
          format: int32

    User:
      type: object
      properties:
        userId:
          type: integer
          format: int32
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
      required: [userId, username, firstName, lastName, email]

    UserCreate:
      type: object
      properties:
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
      required: [username, firstName, lastName, email]

    UserUpdate:
      type: object
      properties:
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email

    Order:
      type: object
      properties:
        orderId:
          type: integer
          format: int32
        bookingStart:
          type: string
          format: date-time
        bookingEnd:
          type: string
          format: date-time
        status:
          type: string
        roomId:
          type: integer
          format: int32
        hasBreakfast:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
        room:
          $ref: '#/components/schemas/Room'
      required: [orderId, bookingStart, bookingEnd, status, roomId, userId, hasBreakfast]

    OrderCreate:
      type: object
      properties:
        bookingStart:
          type: string
          format: date-time
        bookingEnd:
          type: string
          format: date-time
        status:
          type: string
        roomId:
          type: integer
          format: int32
        userId:
          type: integer
          format: int32
        hasBreakfast:
          type: boolean
      required: [bookingStart, bookingEnd, status, roomId, userId, hasBreakfast]

    OrderUpdate:
      type: object
      properties:
        bookingStart:
          type: string
          format: date-time
        bookingEnd:
          type: string
          format: date-time
        status:
          type: string
        hasBreakfast:
          type: boolean

    Media:
      type: object
      properties:
        mediaId:
          type: integer
          format: int32
        path:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        altText:
          type: string
          nullable: true
        sortHelper:
          type: integer
          format: int32
          nullable: true
      required: [mediaId]

    MediaCreate:
      type: object
      properties:
        mediaId:
          type: integer
          format: int32
        path:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        altText:
          type: string
          nullable: true
        sortHelper:
          type: integer
          format: int32
          nullable: true
      required: [mediaId]

    RoomTypeMediaCreate:
      type: object
      properties:
        mediaId:
          type: integer
          format: int32
      required: [mediaId]

    RoomExtra:
      type: object
      properties:
        roomExtraId:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
          nullable: true
        iconKey:
          type: string
          nullable: true
      required: [roomExtraId, name]

    RoomExtraCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        iconKey:
          type: string
          nullable: true
      required: [name]

    RoomExtraUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        iconKey:
          type: string
          nullable: true

    RoomExtraAssignmentCreate:
      type: object
      properties:
        extraId:
          type: integer
          format: int32
      required: [extraId]